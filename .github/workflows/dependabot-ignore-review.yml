# .github/workflows/dependabot-ignore-review.yml
#
# Monthly review of every ignore rule in .github/dependabot.yml
# (scripts/check-dependabot-ignores.mjs). Opens or updates one issue labelled
# `dependabot-ignore-review` with the report: the packages each rule covers, their latest
# release, any high or critical advisory, and the reason recorded for the rule.
#
# A rule that holds back the fix for a high or critical advisory is lifted: the job pushes a
# branch without that rule and links it from the issue, and the job fails so it shows in Actions.
# Repository settings do not let Actions open pull requests, so the PR is opened from the link.
#
# Uses the free single-CPU runner (ubuntu-slim); it only runs Node and calls public APIs.
name: Dependabot Ignore Review

on:
  schedule:
    - cron: "0 14 1 * *"
  workflow_dispatch:

# Nothing by default; the one job asks for what it writes. Its actions are pinned to a commit SHA
# because the job holds a write token (Dependabot updates the SHA and the version comment).
permissions: {}

concurrency:
  group: dependabot-ignore-review
  cancel-in-progress: false

jobs:
  review:
    name: Review Dependabot ignore rules
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # The runner context is not available in job-level env; set the path from a step instead.
      - name: Set report path
        run: echo "REPORT=$RUNNER_TEMP/dependabot-ignore-review.md" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"

      - name: Review ignore rules
        id: review
        run: node scripts/check-dependabot-ignores.mjs --lift --report "$REPORT"

      - name: Push branch with lifted rules
        id: lift
        if: steps.review.outputs.lifted != '0'
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          branch="chore/dependabot-lift-ignores-$(date -u +%Y-%m)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add .github/dependabot.yml
          git commit -m "chore(deps): lift Dependabot ignore rules blocking high-severity fixes"
          # Replaces this month's branch from an earlier run, but never a commit pushed to it since.
          git fetch --depth=1 origin "+refs/heads/$branch:refs/remotes/origin/$branch" 2>/dev/null || true
          git push --force-with-lease="$branch" origin "$branch"
          url="$SERVER_URL/$REPOSITORY/compare/$DEFAULT_BRANCH...$branch?expand=1"
          printf '\n### Lifted rules\n\nOpen the pull request: %s\n' "$url" >> "$REPORT"

      - name: Job summary
        if: always() && steps.review.outcome == 'success'
        run: cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update review issue
        if: steps.review.outcome == 'success'
        env:
          LIFTED: ${{ steps.review.outputs.lifted }}
        run: |
          label="dependabot-ignore-review"
          title="Dependabot ignore review $(date -u +%Y-%m)"
          if [ "$LIFTED" != "0" ]; then
            title="$title: high-severity fix blocked, rules lifted"
          fi
          gh label create "$label" --color FBCA04 --description "Monthly Dependabot ignore review" --force
          issue=$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')
          # The body always holds the latest report, so a reader of the open issue never sees an old one.
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --title "$title" --body-file "$REPORT"
            gh issue comment "$issue" --body "Report for $(date -u +%Y-%m) replaced the issue body."
          else
            gh issue create --title "$title" --label "$label" --body-file "$REPORT"
          fi

      - name: Fail when a rule was lifted
        if: steps.review.outputs.lifted != '0'
        run: |
          echo "::error::A Dependabot ignore rule held back a high or critical fix; see the review issue."
          exit 1
