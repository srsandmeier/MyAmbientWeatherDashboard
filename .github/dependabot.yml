version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/backend"
    schedule:
      interval: "weekly"
    ignore:
      # MediatR 13+ is commercially licensed; violates the free-license rule in CLAUDE.md.
      - dependency-name: "MediatR"
        versions: [">= 13.0.0"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    ignore:
      # eslint-plugin-react and eslint-plugin-jsx-a11y peer ranges stop at ESLint 9.
      # Remove once both plugins support the next ESLint major.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8.x peers on typescript ">=4.8.4 <6.1.0"; newer TypeScript fails
      # peer resolution. Raise this bound once typescript-eslint widens its range.
      - dependency-name: "typescript"
        versions: [">= 6.1.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
