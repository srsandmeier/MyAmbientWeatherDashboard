version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/backend"
    schedule:
      interval: "weekly"
    # Every ignore rule is reviewed monthly by .github/workflows/dependabot-ignore-review.yml.
    # A rule that blocks the fix for a high or critical advisory is lifted automatically.
    ignore:
      # MediatR 13+ is commercially licensed; violates the free-license rule in CLAUDE.md.
      - dependency-name: "MediatR"
        versions: [">= 13.0.0"]
      # .NET 11 packages: the app targets .NET 10 (LTS). Version-11 packages on the net10 runtime
      # broke SignalR (NU1605 restore error, hub tests failing). Remove when the app moves to .NET 11;
      # 10.0.x patches still arrive.
      - dependency-name: "Microsoft.AspNetCore.*"
        versions: [">= 11.0.0"]
      - dependency-name: "Microsoft.Extensions.*"
        versions: [">= 11.0.0"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        versions: [">= 11.0.0"]
      - dependency-name: "System.*"
        versions: [">= 11.0.0"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    ignore:
      # eslint-plugin-react and eslint-plugin-jsx-a11y peer ranges stop at ESLint 9.
      # Remove once both plugins support the next ESLint major.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8.x peers on typescript ">=4.8.4 <6.1.0"; newer TypeScript fails
      # peer resolution. Raise this bound once typescript-eslint widens its range.
      - dependency-name: "typescript"
        versions: [">= 6.1.0"]
      # @microsoft/signalr 11 is the .NET 11 client; the hub runs on .NET 10 (see the nuget
      # Microsoft.AspNetCore.* rule). Remove when the app moves to .NET 11.
      - dependency-name: "@microsoft/signalr"
        versions: [">= 11.0.0"]

  # Playwright and the E2E toolchain; after a @playwright/test update the browsers must be reinstalled
  # (dependabot-combine skill, "Verify").
  - package-ecosystem: "npm"
    directory: "/tests/e2e"
    schedule:
      interval: "weekly"
    ignore:
      # CI and engines run Node 24 LTS; newer @types/node types APIs that Node 24 lacks.
      # Remove when the repo moves to the next Node LTS.
      - dependency-name: "@types/node"
        versions: [">= 26.0.0"]
      # Keep E2E on the frontend's TypeScript major, which typescript-eslint bounds below 6.1.
      # Remove once the frontend typescript rule is raised past 7.0.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Root dev tooling (concurrently for npm run start:all).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
